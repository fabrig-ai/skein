[package]
name = "skein-ui-web"
description = "Portable browser parts for semantic user interfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
loopback-navigation = []

[dependencies]
skein-ui.workspace = true
skein-lib.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "Node", "NodeList", "Text", "HtmlCollection", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlOptionElement", "HtmlOptionsCollection", "HtmlTextAreaElement", "HtmlDialogElement", "Event", "EventTarget", "MouseEvent", "KeyboardEvent", "InputEvent", "ResizeObserver", "ResizeObserverEntry", "DomRect", "DomRectReadOnly", "Window", "Request", "RequestInit", "RequestCredentials", "RequestMode", "Response", "AbortController", "AbortSignal", "Headers", "Navigator", "Performance", "Crypto", "ReadableStream", "ReadableStreamDefaultReader", "Storage", "Location", "History", "PopStateEvent", "BeforeUnloadEvent", "ScrollRestoration", "Worker", "WorkerOptions", "WorkerType", "MessageEvent"] }


# Browser parts are ordinary Rust (ui-web.md, 5.1).
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
